name:  Build and Release Global Tool

on:
  push:
    # Trigger this workflow only when a new tag is pushed (e.g., v1.0.0)
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    
    # Define environment variables needed for the workflow
    permissions:
      contents: write # Required for creating releases

    env:
      PROJECT_PATH: GitCommitGen.csproj

    steps:
      - name:  Checkout Code
        uses: actions/checkout@v4
        
      - name:  Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name:  Restore Dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}
        
      - name:  Build Project
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      # ----------------------------------------
      # --- STEPS FOR REPORT GENERATION ---
      # ----------------------------------------
        
      - name:  Run Tests & Collect Coverage
        # Executes tests and generates the coverage file (coverage.cobertura.xml)
        run: |
          dotnet test GitCommitGen.Tests/GitCommitGen.Tests.csproj \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./coverage/ \
            /p:CoverletOutputFormat=cobertura
            
      - name:  Generate HTML Coverage Report
        # Uses ReportGenerator tool to convert XML into HTML
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:coverage/coverage.cobertura.xml \
            -targetdir:./coverage/html_report \
            -reporttypes:Html
        
      # ----------------------------------------  
        
      - name:  Pack NuGet Tool
        # The 'dotnet pack' command creates the .nupkg file
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output nuget_packages
        
      - name:  Get Package Version
        # Extract the version number from the Git tag (e.g., 'v1.0.0' -> '1.0.0')
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name:  Upload Artifacts for Release
        uses: actions/upload-artifact@v4
        with:
          name: GitCommitGen-Package-${{ steps.get_version.outputs.VERSION }}
          path: nuget_packages/*.nupkg

      - name:  Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          files: |
            nuget_packages/*.nupkg
            coverage/html_report/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}